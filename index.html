<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Cartas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #2e7d32;
            color: white;
            padding: 20px;
        }
        .cartas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .cartas-container img {
            width: 120px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>Laboratorio de Cartas</h1>
    <div class="cartas-container">
        <img src="10C.png" alt="Carta 10C">
        <img src="10D.png" alt="Carta 10D">
        <img src="10H.png" alt="Carta 10H">
        <img src="10S.png" alt="Carta 10S">
        <img src="2C.png" alt="Carta 2C">
        <img src="2D.png" alt="Carta 2D">
    </div>
</body>
</html>
